# Colorimeter — instrument hardware configuration
#
# config_manager.py is the only reader of this file. Anything tunable without
# editing code lives here; the built-in _DEFAULTS in config_manager fill in
# anything omitted, so a mistyped or missing file never stops a capture.

# Where capture archives are written, what they are called, which LEDs a run
# sweeps, and the exposure group used when none is saved.
capture:
  # Relative paths resolve against the project root — the directory holding
  # src/ and config/. On the Pi that makes this ~/pi/Colorimeter/captures.
  # An absolute path is used as given.
  directory:        captures
  # strftime format for the timestamp that names each archive, and which is
  # also stored as the archive's suite_id.
  timestamp_format: "%Y%m%d_%H%M"
  extension:        .h5
  # Inclusive LED channel range a capture run sweeps (1..10 = every LED).
  led_start:        1
  led_end:          10
  # Exposure group preselected when the saved group is missing or has no active
  # rows left in the exposure table.
  fallback_exposure_group: "3"

# Timed protocol steps, in seconds. The simulation profile (bottom of file)
# shortens the reagent waits so a run is quick to test, but only in simulation.
# To shorten them on the instrument itself use Menu -> Config: the durations
# entered there are saved to config/user_settings.json and win over both the
# values here and the simulation profile. Menu -> Config -> Restore drops them
# and puts these values back in charge.
protocol:
  reagent1_secs: 120
  reagent2_secs: 420
  analysis_secs: 1.5        # placeholder until the analysis engine lands

# Event-loop and screen timing.
runtime:
  main_loop_poll_s:   0.02  # main-loop cadence
  shutdown_timeout_s: 15.0  # shutdown screen auto-picks Exit after this

# Which default_gui_vals row seeds the entry screens.
defaults:
  rowid: 1

display:
  width:         320
  height:        240
  header_height:  50
  status_height:  25
  # body_height is computed: height - header_height - status_height = 165

hardware:
  backlight_pin: 13
  spi_device:    0
  i2c_bus:       1

# Relative paths resolve against the project root. src/colorimeter.sqlite is
# the historical location; $COLORIMETER_DB overrides it for one process.
database:
  path: src/colorimeter.sqlite

# Persistent simulation default. The COLORIMETER_SIMULATION env var overrides
# this (run_simulation.py sets it to "1"). When simulation is active, the
# simulation_overrides profile below is merged on top of everything else.
simulation: false

# Values that replace their counterparts above only while simulation is active
# (COLORIMETER_SIMULATION=1 or `simulation: true`) — never on real hardware.
# Add any key here to give it a simulation-specific variant.
simulation_overrides:
  protocol:
    reagent1_secs: 10
    reagent2_secs: 10
